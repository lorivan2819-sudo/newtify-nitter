name: Newtify publish ping

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "Keep starting the next minute ping run"
        required: false
        default: "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: newtify-publish-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Call publisher every 10 seconds
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            echo "publish ping $attempt/30"
            body="$(curl --fail-with-body --silent --show-error --max-time 55 https://newtify-nitter.vercel.app/api/publish)"
            echo "$body"
            echo "$body" | python -m json.tool >/dev/null
            printf '%s' "$body" | python -c "import json,sys; data=json.load(sys.stdin); assert data.get('ok'), 'Publisher returned ok=false'; print('posted:', ','.join(data.get('posted') or []) or 'none')"
            if [ "$attempt" != "30" ]; then
              sleep 10
            fi
          done

      - name: Start next ping run
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.chain != 'false') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-ping.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f chain=true
